<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gohite Management - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e6e0e9",
                        "tertiary-fixed": "#ffdf93",
                        "on-secondary-fixed-variant": "#4b4263",
                        "on-primary-fixed": "#22005d",
                        "inverse-surface": "#322f35",
                        "primary-fixed-dim": "#cfbcff",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary": "#63597c",
                        "on-error-container": "#93000a",
                        "outline": "#7a7582",
                        "surface-container": "#f2ecf4",
                        "error-container": "#ffdad6",
                        "surface-dim": "#ded8e0",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1d1b20",
                        "inverse-primary": "#cfbcff",
                        "secondary-fixed-dim": "#cdc0e9",
                        "on-error": "#ffffff",
                        "surface-variant": "#e6e0e9",
                        "on-tertiary-container": "#503d00",
                        "tertiary": "#765b00",
                        "secondary-container": "#e1d4fd",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f8f2fa",
                        "error": "#ba1a1a",
                        "primary-fixed": "#e9ddff",
                        "on-secondary-container": "#645a7d",
                        "tertiary-container": "#c9a74d",
                        "inverse-on-surface": "#f5eff7",
                        "surface-tint": "#6750a4",
                        "primary-container": "#6750a4",
                        "outline-variant": "#cbc4d2",
                        "on-surface-variant": "#494551",
                        "on-tertiary-fixed": "#241a00",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#4f378a",
                        "background": "#fdf7ff",
                        "surface-bright": "#fdf7ff",
                        "surface": "#fdf7ff",
                        "on-secondary-fixed": "#1f1635",
                        "surface-container-high": "#ece6ee",
                        "primary": "#4f378a",
                        "secondary-fixed": "#e9ddff",
                        "on-primary-container": "#e0d2ff",
                        "on-background": "#1d1b20",
                        "tertiary-fixed-dim": "#e7c365"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }

<style>
        body {
            background: linear-gradient(135deg, #fdf7ff 0%, #f2ecf4 50%, #e1d4fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .glass-card {
            background: rgba(253, 247, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 196, 210, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="font-body text-on-surface antialiased p-4 md:p-8 justify-center items-center">
<div class="w-full max-w-md mx-auto">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-8">
<img alt="Gohite Business Logo" class="w-24 h-24 rounded-2xl shadow-sm mb-4 object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUwpcpUStkegCaIeMgU7DHBY-K3ewaFEzaf7GNqPCpXXKY5_lwlfsmRW9cCMnorcS2_x-2ccS1Vp3SRrEX73cgmHOT7nIAqHhie7Pab05SpDp1VkSSeQJoOScypSxkpIG6MvtbZ6m7MFoVlaPx7vsuxRHuyYfbsh5E4EVlAzASza_OTAXBl0ltso4LIEHihpMbiGDjCzwwSrfa1YRCKljTyZu1gQUAlwUgUq4px6Er_5t3DnzW_LXSrgDnGbeN2GYecRJSMSbUTHfG"/>
<h1 class="font-headline text-headline-sm font-bold text-on-surface tracking-tight">Gohite Management</h1>
<p class="text-on-surface-variant font-body text-label-md mt-1">Sign in to your account</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-6 sm:p-8">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-label-sm font-medium text-on-surface mb-1.5" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="mail">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-shadow h-10" id="email" name="email" placeholder="admin@gohite.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-label-sm font-medium text-on-surface" for="password">Password</label>
<a class="text-label-sm font-medium text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-shadow h-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined text-lg" data-icon="visibility" id="visibility-icon">visibility</span>
</div>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-label-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me
                    </label>
</div>
<div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-label-md font-medium text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all h-10 items-center" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-6 text-center text-label-sm text-on-surface-variant">
                By signing in, you agree to Gohite's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </div>
</div>
</div>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
