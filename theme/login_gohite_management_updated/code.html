<!DOCTYPE html>

<html class="light" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gohite Management - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#f2ecf4",
                        "surface-container-low": "#f8f2fa",
                        "inverse-primary": "#cfbcff",
                        "surface-bright": "#fdf7ff",
                        "surface-container-high": "#ece6ee",
                        "outline-variant": "#cbc4d2",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e6e0e9",
                        "on-tertiary-fixed-variant": "#594400",
                        "on-primary-fixed-variant": "#4f378a",
                        "on-background": "#1d1b20",
                        "primary-fixed-dim": "#cfbcff",
                        "on-secondary-container": "#645a7d",
                        "tertiary-fixed-dim": "#e7c365",
                        "on-surface-variant": "#494551",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#63597c",
                        "on-secondary-fixed-variant": "#4b4263",
                        "on-primary-fixed": "#22005d",
                        "tertiary-container": "#c9a74d",
                        "on-primary-container": "#e0d2ff",
                        "secondary-fixed-dim": "#cdc0e9",
                        "tertiary": "#765b00",
                        "inverse-on-surface": "#f5eff7",
                        "surface-container-highest": "#e6e0e9",
                        "outline": "#7a7582",
                        "primary-container": "#6750a4",
                        "surface-tint": "#6750a4",
                        "error-container": "#ffdad6",
                        "surface": "#fdf7ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdf93",
                        "surface-dim": "#ded8e0",
                        "error": "#ba1a1a",
                        "inverse-surface": "#322f35",
                        "primary-fixed": "#e9ddff",
                        "primary": "#4f378a",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#503d00",
                        "secondary-fixed": "#e9ddff",
                        "on-tertiary-fixed": "#241a00",
                        "on-secondary-fixed": "#1f1635",
                        "background": "#fdf7ff",
                        "secondary-container": "#e1d4fd",
                        "on-surface": "#1d1b20"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Subtle Background Gradient Decoration -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-0 left-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
<div class="absolute top-1/4 right-1/4 w-96 h-96 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
<div class="absolute -bottom-8 left-1/3 w-96 h-96 bg-tertiary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
</div>
<!-- Login Card -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-outline-variant/30 p-8 z-10 relative">
<!-- Header / Branding -->
<div class="flex flex-col items-center mb-8">
<img alt="Gohite BizSphere Logo" class="w-32 h-auto mb-4 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtbezctrjdjToYEwf85yNLDnsP7J53XfIh0MXC2qdip0VuM1-Fa2OlcM1jOKRJPq-vms85uPsZnsECYnlcoZfPdIOeh2UOw-UhB7dgUol8lU0eFeA3pFMpZd4mJH8_xU22ENpfNvcFY39eg0QZTdBnb24JZyODe6Vhp6EDFeSuTsCVwrjriQFMAEQQxDzGUkG40N-cJYZnPWUhvq62Tm3mvSP2VNMYbAbvKqunCSe3KW-BgDE1WC9UMyPV7bZv2XD68cGA1oI7PKBv"/>
<h1 class="font-headline text-2xl font-bold text-on-surface text-center tracking-tight mb-1">Gohite Management</h1>
<p class="font-body text-on-surface-variant text-sm text-center">Sign in to your enterprise suite</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label text-sm font-medium text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface text-on-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors" id="email" name="email" placeholder="admin@gohite.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label text-sm font-medium text-on-surface" for="password">Password</label>
<a class="font-label text-sm font-medium text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 bg-surface text-on-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant font-body" for="remember-me">
                    Remember me for 30 days
                </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label text-sm font-medium text-on-primary bg-primary hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                Sign In
            </button>
</form>
<!-- Footer Footer -->
<div class="mt-8 text-center border-t border-outline-variant/30 pt-6">
<p class="text-xs text-on-surface-variant font-body">
                Secure enterprise login powered by Gohite Systems. <br/>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a> · <a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</p>
</div>
</main>
<style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</body></html>
