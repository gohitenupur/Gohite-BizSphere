services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gohite_bizsphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gohite_bizsphere?schema=public
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  pgdata:
